[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinesphere-ml"
version = "0.1.0"
description = "CineSphere Offline Machine Learning Package: Semantic Embeddings, Clustering & Recommendations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CineSphere Engineering" }
]
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
ml = [
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "hdbscan>=0.8.38",
    "umap-learn>=0.5.6",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["embeddings*", "clustering*", "similarity*", "recommendations*", "taste_profiling*", "movie_map*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
