name: CineSphere CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript Monorepo (Web, API, Shared)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cinesphere_user
          POSTGRES_PASSWORD: cinesphere_test_password
          POSTGRES_DB: cinesphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cinesphere_user:cinesphere_test_password@localhost:5432/cinesphere_test?schema=public
      CINESPHERE_SINGLE_USER_ID: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm format:check

      - name: Run Unit Tests
        run: pnpm test

      - name: Deploy Prisma Migrations
        run: pnpm --filter @cinesphere/api exec prisma migrate deploy

      - name: Run Backend Integration Tests
        run: pnpm test:integration

      - name: Build Packages
        run: pnpm build

  python:
    name: Python ML Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lint & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Ruff Lint Check
        run: python -m ruff check ml/

      - name: Ruff Format Check
        run: python -m ruff format --check ml/

      - name: Pytest
        run: python -m pytest ml/tests -v
