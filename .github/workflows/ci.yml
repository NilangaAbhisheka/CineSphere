name: CineSphere CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript Monorepo (Web, API, Shared)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm format:check

      - name: Run Tests
        run: pnpm test

      - name: Build Packages
        run: pnpm build

  python:
    name: Python ML Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lint & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Ruff Lint Check
        run: python -m ruff check ml/

      - name: Ruff Format Check
        run: python -m ruff format --check ml/

      - name: Pytest
        run: python -m pytest ml/tests -v
